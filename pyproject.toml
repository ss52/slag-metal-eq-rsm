[project]
name = "slag-activity-model"
version = "0.1.0"
description = "EAF slag-metal equilibrium model (Ban-ya quadratic formalism with oxygen-potential balance)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Markelov" }]
keywords = [
    "metallurgy",
    "EAF",
    "slag",
    "regular-solution-model",
    "thermodynamics",
    "activity-coefficient",
    "steelmaking",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.13"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.1",
]

[project.scripts]
slag-model = "slag_model.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slag_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["slag_model", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["slag_model"]
